name: CI

on:
  push:
    branches: [master]
  # No base-branch filter: roadmap phases land as stacked PRs whose base is the
  # preceding phase branch, not master. Filtering on `branches` would match the
  # base and silently skip every PR except the one at the bottom of the stack.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Gradle deprecations that will break the next Gradle major fail the build here, and any new
  # Kotlin compiler warning is an error. Local builds stay warning-tolerant.
  GRADLE_FLAGS: >-
    --no-daemon
    --stacktrace
    --warning-mode fail
    -Pttsroad.warningsAsErrors=true

jobs:
  build:
    name: Build, test and package (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Verifies gradle-wrapper.jar against the checksums Gradle publishes, before it is executed.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # The build targets a JDK 25 toolchain. Installing it here means the toolchain resolves
      # locally; the foojay resolver in settings.gradle.kts remains the fallback for developers
      # who do not have it.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (with dependency + build caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Compiles main + test, runs the JUnit 5 unit tests AND the Compose desktop UI tests.
      # Skiko needs a display even for off-screen rendering, hence Xvfb.
      - name: Compile, unit tests and Compose UI tests
        run: xvfb-run -a ./gradlew ${{ env.GRADLE_FLAGS }} clean check

      # Static analysis for this phase is the two gates baked into GRADLE_FLAGS:
      #   --warning-mode fail          -> Gradle deprecations that break Gradle 10
      #   -Pttsroad.warningsAsErrors   -> Kotlin compiler warnings
      # This step re-runs configuration only, so a deprecation introduced in the build script
      # itself is reported separately from a test failure.
      - name: Static analysis (build-script + compiler warnings)
        run: ./gradlew ${{ env.GRADLE_FLAGS }} help

      - name: Build the distributable (bundled runtime image)
        run: ./gradlew ${{ env.GRADLE_FLAGS }} createDistributable

      # Proves the jlink image actually starts: loads Skiko's native library, composes the real
      # UI, and confirms the mp3spi javax.sound.sampled provider survived module minimisation.
      # Exits non-zero if any of that fails.
      - name: Headless launch smoke test of the packaged app
        run: xvfb-run -a ./build/compose/binaries/main/app/TTSRoad/bin/TTSRoad --smoke-test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn
          retention-days: 14
